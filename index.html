<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicație Web Gestionare Chei Sheltere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1f4e78;
            --secondary-color: #2c3e50;
            --accent-color: #007bff;
            --bg-color: #f4f7f6;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .header-title {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .card-header {
            background-color: white;
            border-bottom: 2px solid #eef2f5;
            font-weight: 700;
            color: var(--primary-color);
            border-radius: 12px 12px 0 0 !important;
            padding: 15px 20px;
        }
        .btn-custom {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #163857;
            color: white;
            transform: translateY(-2px);
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-finalizat { background-color: #d4edda; color: #155724; }
        .badge-in-curs { background-color: #fff3cd; color: #856404; }
        .badge-anulat { background-color: #f8d7da; color: #721c24; }
        .table-responsive {
            border-radius: 8px;
            overflow: hidden;
        }
        .table th {
            background-color: #f8f9fa;
            color: var(--secondary-color);
            font-weight: 600;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>
<body>

<div class="header-title text-center">
    <div class="container">
        <h1><i class="fa-solid fa-key me-2"></i>Sistem Gestionare Predare Chei Sheltere</h1>
        <p class="mb-0 opacity-75">Sincronizare Cloud Live Google Sheets</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row">
        <!-- Formular Adaugare -->
        <div class="col-lg-4 mb-4">
            <div class="card h-100">
                <div class="card-header d-flex align-items-center">
                    <i class="fa-solid fa-pen-to-square me-2"></i> Formular Predare Chei
                </div>
                <div class="card-body">
                    <form id="keyForm">
                        <div class="mb-3">
                            <label for="judet" class="form-label">Județ</label>
                            <select id="judet" class="form-select" required>
                                <option value="">-- Selectează Județul --</option>
                                <option value="Dolj">Dolj</option>
                                <option value="Gorj">Gorj</option>
                                <option value="Mehedinti">Mehedinți</option>
                                <option value="Olt">Olt</option>
                                <option value="Valcea">Vâlcea</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="site" class="form-label">Site (Locație)</label>
                            <input type="text" id="site" class="form-control" placeholder="Denumire Site / Cod" required>
                        </div>

                        <div class="mb-3">
                            <label for="subcontractor" class="form-label">Subcontractor</label>
                            <input type="text" id="subcontractor" class="form-control" placeholder="Nume Subcontractor" required>
                        </div>

                        <div class="mb-3">
                            <label for="activitate" class="form-label">Activitate</label>
                            <input type="text" id="activitate" class="form-control" placeholder="Ex: Intervenție / Mentenanță" required>
                        </div>

                        <div class="mb-3">
                            <label for="start" class="form-label">Data și Ora Start</label>
                            <input type="datetime-local" id="start" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="end" class="form-label">Data și Ora End</label>
                            <input type="datetime-local" id="end" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" class="form-select" required>
                                <option value="În Curs">În Curs</option>
                                <option value="Finalizat">Finalizat</option>
                                <option value="Anulat">Anulat</option>
                            </select>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-custom w-100">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Salvează Predarea
                        </button>
                    </form>
                    <div id="status-msg" class="mt-3 text-center fw-bold"></div>
                </div>
            </div>
        </div>

        <!-- Tabel Evidenta Live -->
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fa-solid fa-list-check me-2"></i> Evidență Predări Chei în Timp Real</span>
                    <button id="refreshBtn" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-rotate me-1"></i> Actualizează</button>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="searchInput" class="form-control" placeholder="Căutare după site, subcontractor, activitate...">
                        </div>
                        <div class="col-md-6 text-end">
                            <span class="text-muted small">Date sincronizate direct cu Google Sheets</span>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="recordsTable">
                            <thead>
                                <tr>
                                    <th>Județ</th>
                                    <th>Site</th>
                                    <th>Subcontractor</th>
                                    <th>Activitate</th>
                                    <th>Perioadă</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="text-center py-4 text-muted">Se încarcă datele din Google Sheets...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbza4qKCzSBgzqdolTmkBI8GDo0c6Ajb8j2njK0OPl_KeTTfvpImStj15wn_n60j8cfWaA/exec";

    // Incarcare date din Google Sheets
    function loadData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>Se încarcă datele din Cloud...</td></tr>';
        
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(response => {
                if (response.result === 'success') {
                    renderTable(response.data);
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger">Eroare la preluarea datelor.</td></tr>';
                }
            })
            .catch(err => {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger">Nu s-au putut încărca datele. Reîncercați.</td></tr>';
            });
    }

    // Afisare tabel
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Nu există înregistrări în Google Sheets.</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        data.reverse().forEach(row => {
            let statusBadge = '';
            if (row.Status === 'Finalizat') statusBadge = '<span class="badge-status badge-finalizat">Finalizat</span>';
            else if (row.Status === 'În Curs') statusBadge = '<span class="badge-status badge-in-curs">În Curs</span>';
            else statusBadge = '<span class="badge-status badge-anulat">' + (row.Status || 'Anulat') + '</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${row.Judet || ''}</strong></td>
                <td>${row.Site || ''}</td>
                <td>${row.Subcontractor || ''}</td>
                <td>${row.Activitate || ''}</td>
                <td><small>${formatDate(row.Start)} - ${formatDate(row.End)}</small></td>
                <td>${statusBadge}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function formatDate(dt) {
        if (!dt) return '';
        return dt.replace('T', ' ');
    }

    // Salvare Formular
    document.getElementById('keyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('status-msg');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Se salvează în Cloud...';
        msg.className = "mt-3 text-center text-primary fw-bold";
        msg.textContent = "Se trimit datele...";

        const formData = {
            id: 'ID_' + new Date().getTime(),
            judet: document.getElementById('judet').value,
            site: document.getElementById('site').value,
            subcontractor: document.getElementById('subcontractor').value,
            activitate: document.getElementById('activitate').value,
            start: document.getElementById('start').value,
            end: document.getElementById('end').value,
            status: document.getElementById('status').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            msg.className = "mt-3 text-center text-success fw-bold";
            msg.textContent = "Salvat cu succes în Google Sheets!";
            document.getElementById('keyForm').reset();
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-2"></i> Salvează Predarea';
            setTimeout(loadData, 1000);
        })
        .catch(error => {
            console.error('Eroare:', error);
            msg.className = "mt-3 text-center text-danger fw-bold";
            msg.textContent = "Eroare la salvare. Verificați conexiunea.";
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-2"></i> Salvează Predarea';
        });
    });

    // Cautare in tabel
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(filter) ? '' : 'none';
        });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    // Incarcare initiala
    loadData();
</script>

</body>
</html>
